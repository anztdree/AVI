name: Build AVI APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-avi
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Terima lisensi Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Pasang komponen SDK yang dibutuhkan
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Release APK (R8 — ringan & cepat)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVI-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Perbarui Release v1.0.0 dengan APK terbaru
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag v1.0.0 selalu digeser ke commit terbaru yang lulus build
          git config user.name "avi-ci"
          git config user.email "avi-ci@users.noreply.github.com"
          git tag -f v1.0.0 "$GITHUB_SHA"
          git push -f origin v1.0.0

          # Ganti isi release (APK baru menggantikan APK lama)
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || {
            gh release create v1.0.0 \
              --repo "$GITHUB_REPOSITORY" \
              --title "AVI v1.0.0 — Full Feature (Mark II)" \
              --notes "APK resmi AVI. Selalu unduh dari release ini untuk versi terbaru."
          }
          gh release upload v1.0.0 \
            "app/build/outputs/apk/release/app-release.apk#AVI-v1.0.0.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          echo "Release v1.0.0 diperbarui dengan commit: $GITHUB_SHA"
